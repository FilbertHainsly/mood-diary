name: mood_diary
description: A Flutter app for tracking mood through diary entries with AI prediction.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Firebase
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.8
  cloud_firestore: ^4.15.8
  firebase_storage: ^11.6.0

  # State Management
  provider: ^6.1.2

  # HTTP
  http: ^1.2.1

  # AI - Gemini
  google_generative_ai: ^0.4.6

  # Image
  image_picker: ^1.0.7
  flutter_image_compress: ^2.3.0
  cached_network_image: ^3.3.1
  path_provider: ^2.1.2

  # Utilities
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
